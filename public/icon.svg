<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (adaptive for Android, iOS & Windows) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- School Graduation Cap & Building Emblems -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Graduation Mortarboard Top -->
    <polygon points="256,110 430,200 256,290 82,200" fill="#ffffff"/>
    
    <!-- Cap Underneath Base -->
    <polygon points="256,280 400,205 400,230 256,305 112,230 112,205" fill="#e0e7ff"/>
    
    <!-- Tassel Button & String -->
    <circle cx="256" cy="200" r="10" fill="url(#capGrad)"/>
    <path d="M256,200 Q200,210 180,270" stroke="url(#capGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="172" y="270" width="16" height="28" rx="4" fill="url(#capGrad)"/>

    <!-- School Columns / Book Emblem Base -->
    <!-- Open Book Base -->
    <path d="M150,330 C200,310 240,320 256,340 C272,310 312,310 362,330 L362,400 C312,380 272,380 256,410 C240,380 200,380 150,400 Z" fill="#ffffff" fill-opacity="0.95"/>
    <line x1="256" y1="340" x2="256" y2="410" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Little star/badge on open book -->
    <circle cx="256" cy="370" r="12" fill="url(#capGrad)"/>
  </g>
</svg>
